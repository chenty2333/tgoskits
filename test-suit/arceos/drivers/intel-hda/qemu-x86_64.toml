args = [
    "-machine", "q35",
    "-cpu", "max",
    "-m", "512M",
    "-smp", "1",
    "-display", "none",
    "-serial", "mon:stdio",
    "-audiodev", "driver=none,id=hda0",
    "-device", "intel-hda",
    "-device", "hda-duplex,audiodev=hda0",
]

timeout = 120
uefi = true
to_bin = true
fail_regex = ["(?i)\\bpanic(?:ked)?\\b"]

[[shell_check_steps]]
success_regex = ["(?m)^INTEL_HDA_QEMU_OK\\s*$"]
